plugins {
    id 'java'
    id 'application'
}

group = 'com.wenzejin'
version = '1.1.0'
mainClassName = 'com.wenzejin.Main'

repositories {
    mavenCentral()
}

sourceCompatibility = JavaVersion.VERSION_21  // 源码兼容性为 Java 21
targetCompatibility = JavaVersion.VERSION_21  // 目标编译版本为 Java 21

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE // 忽略重复的文件

    manifest {
        attributes(
            'Main-Class': mainClassName
        )
    }

    from {
        (configurations.runtimeClasspath).collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // 添加 JAXB 依赖
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'org.glassfish.jaxb:jaxb-runtime:2.3.3'

    // 添加 log4j 依赖
    implementation 'org.apache.logging.log4j:log4j-core:2.12.4'
    implementation 'org.apache.logging.log4j:log4j-api:2.12.4'

    implementation 'org.json:json:20250107'

    // Gson
    implementation 'com.google.code.gson:gson:2.12.1'

    // Progressbar
    implementation 'me.tongfei:progressbar:0.10.1'

    implementation 'commons-cli:commons-cli:1.5.0'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.17.1'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.17.1'
}

test {
    useJUnitPlatform()
}