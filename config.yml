mode:           "normal"

stopMode:       "panic + limited"

# Limit
sourceLimit:    100
followUpLimit:  1500

# Batch Options
batchSize:      100
miniBatchSize:  100
threadLimit:    8

# Database options
databaseUrl:    "data/testcase.db"

# Worker options
workerType:     "infuse"
workspaceRoot:  "workspace"

# Resource options
targetPath:     "cc_utils/INFUSE_ORI/std.jar"
rulesPath:      "rules/4_level_rule/rule_data"
bfuncPath:      "cc_utils/INFUSE_ORI/Bfunction.class"

# Target arguments
arguments:      ["-approach", "PCC+IMD", "-mg"]


# Result output
resultPath:     "./result.json"

