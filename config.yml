mode:           "normal"

# Limit
sourceLimit:    100
followUpLimit:  200

# Acceleration options
enableBatch:    true
batchSize:      50
enableBoost:    true
threadLimit:    8

# Database options
databaseUrl:    "data/testcase.db"

# Worker options
workerType:     "infuse"
workspaceRoot:  "workspace"

# Resource options
targetPath:     "cc_utils/INFUSE_ORI/std.jar"
rulesPath:      "rules/4_level_rule/rule_data"
bfuncPath:      "cc_utils/INFUSE_ORI/Bfunction.class"

# Target arguments
arguments:      ["-approach", "PCC+GEAS_ori", "-mg"]


# Result output
resultPath:     "./result.txt"

